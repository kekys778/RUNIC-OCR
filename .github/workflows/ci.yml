name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (src, scripts, tests, notebooks)
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Unit tests
        run: pytest -q
